[package]
name = "linkshop"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { workspace = true }
# internal dependencies
oidc-login = { workspace = true }
actix-web = "4.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
